name: Publish ColumbiaWalks 3.14.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-3.14.0.yml

permissions:
  contents: write

concurrency:
  group: publish-columbiawalks-3.14.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v3.14.0
      APK: ColumbiaWalks-3.14.0.apk
      APK_URL: https://www.columbiawalks.com/assets/downloads/ColumbiaWalks-3.14.0.apk
      APK_SHA256: 9774eae6b879a2d0fd807c0530b99c83d1d58515af3e3bcb55d0792f8a9fbd1c
      APK_BYTES: "65515091"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm the release is new
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable production release."
            exit 1
          fi

      - name: Download the checksum-pinned APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --output "$APK" "$APK_URL"
          test "$(stat -c '%s' "$APK")" = "$APK_BYTES"
          echo "$APK_SHA256  $APK" | sha256sum --check --strict

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'RELEASE_NOTES'
          ## ColumbiaWalks for Android 3.14.0

          This release adds the low-friction continuous reporting workflow requested for walking surveys and preserves the permanent ColumbiaWalks production signing identity established in 3.13.0.

          ### Rapid continuous reporting

          - Adds a dedicated Repeat Reporting screen for a photograph-submit-next workflow while walking.
          - Supports taking a picture or selecting one from the photo library.
          - Reads GPS from the picture when available, falls back to a fresh device location, and allows a manual override.
          - Adds optional sidewalk lip-height ranges and optional vehicle-behavior choices.
          - Keeps comments optional and resets immediately for the next report after submission.
          - Applies photo-first GPS and manual override behavior throughout the additional reporting hierarchies.

          ### Page of Shame and reliability

          - Allows either camera capture or photo attachment.
          - Cancelling the camera or picker now returns to a usable form instead of trapping the user.
          - Includes backend compatibility and tester-access support fixes.

          ### Verification

          - Package: `org.columbiawalks.app`
          - Version: `3.14.0`
          - Version code: `31400`
          - APK size: `65,515,091` bytes
          - APK SHA-256: `9774eae6b879a2d0fd807c0530b99c83d1d58515af3e3bcb55d0792f8a9fbd1c`
          - Signing certificate SHA-256: `A0:C9:E5:AB:C9:9C:AE:C8:D2:EC:31:18:1C:75:C5:77:D0:09:63:E0:AF:3F:65:4A:CA:19:BB:3F:73:55:DC:C4`
          - APK Signature Schemes v2 and v3 verified; ZIP alignment and archive integrity checks passed.

          This APK updates 3.13.0 in place because both releases use the same permanent signer. Users on versions signed by older temporary certificates must first follow the 3.13.0 upgrade note.

          Download the APK below on an Android device and follow Android's normal installation prompts.
          RELEASE_NOTES

      - name: Publish the immutable production release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ColumbiaWalks 3.14.0" \
            --notes-file release-notes.md

      - name: Verify GitHub release metadata
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq '[.assets[] | select(.name == env.APK)] | length' <<<"$release_json")" = "1"
          test "$(jq -r '.assets[] | select(.name == env.APK) | .size' <<<"$release_json")" = "$APK_BYTES"
          test "$(jq -r '.assets[] | select(.name == env.APK) | .digest' <<<"$release_json")" = "sha256:$APK_SHA256"
