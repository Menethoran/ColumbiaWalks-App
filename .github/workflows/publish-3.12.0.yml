name: Publish ColumbiaWalks 3.12.0

on:
  push:
    branches:
      - agent/pos-3.12.0
    paths:
      - .github/workflows/publish-3.12.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified Android package
        run: curl --fail --location --retry 5 --output ColumbiaWalks-3.12.0.apk https://www.columbiawalks.com/assets/downloads/ColumbiaWalks-3.12.0.apk

      - name: Verify the Android package
        run: echo "8459084c243d79087bd4670964ef7a59c65271f1217aca535e3642a5ee4cdc67  ColumbiaWalks-3.12.0.apk" | sha256sum --check --strict

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v3.12.0 "ColumbiaWalks-3.12.0.apk#Android APK" --repo "$GITHUB_REPOSITORY" --title "ColumbiaWalks 3.12.0" --notes-file RELEASE_NOTES_3.12.0.md --latest
