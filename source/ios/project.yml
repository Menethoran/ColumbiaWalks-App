name: ColumbiaWalks
options:
  bundleIdPrefix: org.columbiawalks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.16.0"
    CURRENT_PROJECT_VERSION: "31600"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JKA6EGL5J2
targets:
  ColumbiaWalks:
    type: application
    platform: iOS
    sources:
      - path: ColumbiaWalks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.columbiawalks.app
        PRODUCT_NAME: ColumbiaWalks
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ColumbiaWalks/Info.plist
      properties:
        CFBundleDisplayName: ColumbiaWalks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: ColumbiaWalks uses your location while you confirm a safety report location or rapidly document repeated issues.
        NSCameraUsageDescription: ColumbiaWalks uses the camera only when you choose to attach a report photo.
        NSPhotoLibraryUsageDescription: ColumbiaWalks lets you attach a report picture and use its embedded GPS coordinates; metadata is removed from the stored picture.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ColumbiaWalksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColumbiaWalksTests
    dependencies:
      - target: ColumbiaWalks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.columbiawalks.app.tests
        GENERATE_INFOPLIST_FILE: YES
